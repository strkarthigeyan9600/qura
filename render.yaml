# Free demonstration service. Runtime data is lost on restart/redeploy.
services:
  - type: web
    name: qura-fullstack
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: QURA_STORAGE_DIR
        value: /tmp/qura
      - key: QURA_JWT_SECRET
        generateValue: true
      - key: QURA_COOKIE_SECURE
        value: 'true'
      - key: QURA_ALLOWED_ORIGINS
        value: https://qura-ge6g.vercel.app
      - key: QURA_SEED_DEMO
        value: 'true'
      - key: QURA_PUBLIC_DEMO
        value: 'true'
      - key: QURA_EXTERNAL_AI_ENABLED
        value: 'false'
